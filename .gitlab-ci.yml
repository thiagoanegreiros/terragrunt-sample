stages:
  - sync

sync_repo:
  stage: sync
  tags:
    - deploy
    - docker
  image:
    name: alpine:3.20
    entrypoint: [""]         # garante que o ENTRYPOINT é /bin/sh
  before_script:
    - apk add --no-cache git openssh
    - git --version
  script:
    - git config --global user.email "sync-bot@gitlab.com"
    - git config --global user.name "GitLab Sync Bot"

    # Clona do GitHub (fonte)
    - git clone --mirror "https://oauth2:${github_token}@github.com/thiagoanegreiros/terragrunt-sample.git" src

    - cd src

    # Adiciona o remoto do GitLab (destino)
    - git remote set-url origin "https://oauth2:${gitlab_token}@gitlab.meta.com.br/tecnologia/devops/mirror-sample.git"

    # Faz push espelhado para o GitLab
    - git push origin --mirror
  only:
    - schedules
